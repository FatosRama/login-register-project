<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/app.css">
    <title>Register Page</title>
</head>
<body>
    <div class="flex-container">
        <div class="left-container">
            <div class="left-content">
                <div class="title">
                    <h1>Register Now!</h1>
                </div>
                <div class="text">
                    <p>Fill out the form and register now!</p>
                </div>
                <div class="image">
                    <svg xmlns="http://www.w3.org/2000/svg" width="150" height="115" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                </div>
            </div>
        </div>
        <div class="right-container">
            <div class="registration-container">
                 <form action="../backend/register.php" method="post" class="registration-form">
                    <fieldset class="registration-field">
                        <legend class="registration-title">Register Here</legend>
                            <label for="name">Name:</label>
                            <input type="text" name="name" class="name" placeholder="Enter your Name: ">
                            <label for="surname">Surname:</label>
                            <input type="text" name="surname" class="surname" placeholder="Enter your Surname: ">
                            <label for="email">Email:</label>
                            <input type="email" name="email" class="email" placeholder="Enter your Email:">
                            <label for="phone_number">Phone Number:</label>
                            <input type="tel" name="phone_number" class="phone-number" placeholder="Enter your Phone Number:">
                            <label for="password">Password:</label>
                            <input type="password" name="password" class="password" placeholder="Enter your Password:">
                            <label for="confirm_password">Confirm Password:</label>
                            <input type="password" name="confirm_password" class="confirm-password" placeholder="Confirm your Password:">
                            <input type="submit" class="submit">
                    </fieldset>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
